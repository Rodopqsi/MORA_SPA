# Render Blueprint: Mora Spa
# Este archivo permite desplegar todo con un clic desde el dashboard de Render
# o con 'render blueprint apply' desde la CLI.

services:
  # API (Express + Prisma)
  - type: web
    name: mora-api
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://mora-web.onrender.com
      # Reemplaza estas con tus claves reales de Culqi
      - key: CULQI_PUBLIC_KEY
        sync: false
      - key: CULQI_SECRET_KEY
        sync: false

  # Web (Next.js)
  - type: web
    name: mora-web
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://mora-api.onrender.com/api
      - key: NEXT_PUBLIC_CULQI_PUBLIC_KEY
        sync: false

databases:
  - name: mora-db
    region: oregon
    plan: free
    ipAllowList: []
